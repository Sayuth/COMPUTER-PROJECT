<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email Safety Scanner</title>

<style>

body{
    font-family: Arial, sans-serif;
    background: linear-gradient(120deg,#0f2027,#203a43,#2c5364);
    margin:0;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
}

/* main container */

.container{
    width:900px;
    background:rgba(255,255,255,0.05);
    backdrop-filter:blur(10px);
    border-radius:15px;
    display:flex;
    padding:40px;
    box-shadow:0 0 30px rgba(0,0,0,0.5);
}

/* left side */

.main{
    flex:2;
}

h1{
    font-size:36px;
    margin-bottom:20px;
}

/* search box */

input{
    width:80%;
    padding:15px;
    border-radius:8px;
    border:none;
    font-size:16px;
}

button{
    padding:15px 25px;
    border:none;
    border-radius:8px;
    background:#00c3ff;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin-top:15px;
}

button:hover{
    background:#0099cc;
}

/* result text */

#result{
    margin-top:20px;
    font-size:20px;
    font-weight:bold;
}

/* antivirus side panel */

.side{
    flex:1;
    border-left:1px solid rgba(255,255,255,0.2);
    padding-left:25px;
}

.side h2{
    font-size:22px;
}

.product{
    background:rgba(255,255,255,0.08);
    padding:15px;
    margin-top:15px;
    border-radius:10px;
}

.buy{
    background:#28a745;
    margin-top:10px;
}

.buy:hover{
    background:#1e7e34;
}

</style>
</head>

<body>

<div class="container">

<div class="main">

<h1>Email Safety Scanner</h1>

<p>Enter an email to check for possible malware or suspicious patterns.</p>

<input type="email" id="email" placeholder="Enter email address">

<br>

<button onclick="scanEmail()">Scan Email</button>

<div id="result"></div>

</div>


<div class="side">

<h2>Recommended Antivirus</h2>

<div class="product">
<p><b>SecureShield Basic</b></p>
<button class="buy">Buy Now</button>
</div>

<div class="product">
<p><b>SecureShield Pro</b></p>
<button class="buy">Buy Now</button>
</div>

<div class="product">
<p><b>SecureShield Ultimate</b></p>
<button class="buy">Buy Now</button>
</div>

</div>

</div>


<script>

function scanEmail(){

let email = document.getElementById("email").value;
let result = document.getElementById("result");

/* basic email validation */

let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

/* suspicious patterns */

let suspicious = ["hack","spam","virus","malware","phish"];

if(!email.match(emailPattern)){
    result.style.color="orange";
    result.innerText="Invalid Email Format";
    return;
}

for(let word of suspicious){
    if(email.toLowerCase().includes(word)){
        result.style.color="red";
        result.innerText="UNSAFE ⚠ Suspicious Email";
        return;
    }
}

result.style.color="lightgreen";
result.innerText="SAFE ✔ No suspicious pattern detected";

}

</script>

</body>
</html>
