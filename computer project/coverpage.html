<!DOCTYPE html>
<html>
<head>
    <title>Safety Checker</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            margin-top: 100px;
        }

        input {
            padding: 10px;
            width: 300px;
        }

        button {
            padding: 10px 20px;
            margin-top: 10px;
        }

        #result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
        }

        #downloadBtn {
            display: none;
            background-color: green;
            color: white;
            border: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<h1>Website & Email Safety Checker</h1>

<input type="text" id="userInput" placeholder="Enter website or email">
<br>

<button onclick="checkSafety()">Check Safety</button>

<div id="result"></div>

<button id="downloadBtn">Download Antivirus</button>

<script>

function checkSafety() {

    let input = document.getElementById("userInput").value.toLowerCase();

    let unsafeWords = ["scam", "phishing", "hack", "fake"];

    let isUnsafe = false;

    for (let i = 0; i < unsafeWords.length; i++) {

        if (input.includes(unsafeWords[i])) {
            isUnsafe = true;
            break;
        }

    }

    if (isUnsafe) {
        document.getElementById("result").innerHTML =
            "⚠ Unsafe - Potential threat detected";
        document.getElementById("result").style.color = "red";
    }
    else {
        document.getElementById("result").innerHTML =
            "✔ Safe - No threats detected";
        document.getElementById("result").style.color = "green";
    }

    document.getElementById("downloadBtn").style.display = "inline-block";
}

</script>

</body>
</html>
